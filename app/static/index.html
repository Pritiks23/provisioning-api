<main>

```
<div class="page-header">
    <div>
        <h2>GPU Cluster</h2>
        <p>Rack inventory and provisioning management</p>
    </div>

    <button class="refresh-btn" onclick="loadGPUs()">
        Refresh
    </button>
</div>

<section class="summary">
    <div class="card">
        <div class="card-label">Total Nodes</div>
        <div class="card-value" id="totalNodes">-</div>
    </div>

    <div class="card">
        <div class="card-label">Available</div>
        <div class="card-value" id="availableNodes">-</div>
    </div>

    <div class="card">
        <div class="card-label">Provisioned</div>
        <div class="card-value" id="provisionedNodes">-</div>
    </div>

    <div class="card">
        <div class="card-label">Total GPUs</div>
        <div class="card-value" id="totalGPUs">-</div>
    </div>
</section>

<section class="panel">
    <div class="panel-header">
        <h3>GPU Nodes</h3>
        <span id="lastUpdated">Loading...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>HOSTNAME</th>
                <th>GPU</th>
                <th>COUNT</th>
                <th>RACK</th>
                <th>STATUS</th>
                <th>ACTION</th>
            </tr>
        </thead>

        <tbody id="gpuTable">
        </tbody>
    </table>
</section>
```

</main>

<script>

async function loadGPUs() {

    const response = await fetch("/gpus");
    const gpus = await response.json();

    const table = document.getElementById("gpuTable");

    table.innerHTML = "";

    let available = 0;
    let provisioned = 0;
    let totalGPUs = 0;

    gpus.forEach(node => {

        totalGPUs += node.gpu_count;

        if (node.status === "available") {
            available++;
        }

        if (node.status === "provisioned") {
            provisioned++;
        }

        const row = document.createElement("tr");

        row.innerHTML = `
            <td class="hostname">${node.hostname}</td>
            <td>${node.gpu_model}</td>
            <td>${node.gpu_count}</td>
            <td>${node.rack}</td>

            <td>
                <span class="badge ${node.status}">
                    ${node.status}
                </span>
            </td>

            <td>
                <button
                    class="provision-btn"
                    onclick="provisionNode('${node.hostname}')"
                    ${node.status !== "available" ? "disabled" : ""}
                >
                    Provision
                </button>
            </td>
        `;

        table.appendChild(row);
    });

    document.getElementById("totalNodes").textContent = gpus.length;
    document.getElementById("availableNodes").textContent = available;
    document.getElementById("provisionedNodes").textContent = provisioned;
    document.getElementById("totalGPUs").textContent = totalGPUs;

    document.getElementById("lastUpdated").textContent =
        "Updated " + new Date().toLocaleTimeString();
}


async function provisionNode(hostname) {

    const response = await fetch(
        `/provision/${hostname}`,
        {
            method: "POST"
        }
    );

    const result = await response.json();

    if (result.status === "provisioned") {
        await loadGPUs();
    } else {
        alert(result.message);
    }
}


loadGPUs();

</script>
