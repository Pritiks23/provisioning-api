services:

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  api:
    build: .
    expose:
      - "8000"
    environment:
      DB_HOST: db
      DB_NAME: gpu_inventory
      DB_USER: gpu_admin
      DB_PASSWORD: gpu_password
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gpu_inventory
      POSTGRES_USER: gpu_admin
      POSTGRES_PASSWORD: gpu_password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
